---
- name: Configure monitoring agents
  hosts: agents
  become: true

  vars:
    package_list: 
      - python3
      - python3-pip
    app_name: "monitoring_agent"
    app_description: "Monitoring service for agent"
    app_dir: "/opt/monitoring-agent"
    script_name: "agent.py"
    python_executable: "/usr/bin/python3"
    monitoring_server_url: "http://192.168.56.101:5000/metrics"

  tasks:
    - name: Install Python and pip
      ansible.builtin.apt:
        name: "{{ package_list }}"
        state: present
        update_cache: true

    - name: Create directory
      ansible.builtin.file:
        path: /opt/monitoring-agent
        state: directory
        mode: '0755'

    - name: Copy agent
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: "{{ansible_user}}"
        group: "{{ansible_user}}"
      loop:
        - { src: '../agent/agent.py', dest: '/opt/monitoring-agent/agent.py'}
        - { src: '../agent/requirements.txt', dest: '/opt/monitoring-agent/requirements.txt'}

    - name: Install requirements
      ansible.builtin.pip:
        requirements: /opt/monitoring-agent/requirements.txt

    - name: Template systemd service
      ansible.builtin.template:
        src: templates/agent.service.j2
        dest: "/etc/systemd/system/{{ app_name }}.service"
        owner: root
        group: root
        mode: "0644"
      notify: Reload systemd

    - name: Force running
      ansible.builtin.meta: flush_handlers

    - name: Enable and start the service
      ansible.builtin.systemd:
        name: "{{ app_name }}"
        enabled: true
        state: started

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

- name: Configure central monitoring server
  hosts: monitoring
  become: true

  tasks:
    - name: Install dependencies
      ansible.builtin.apt:
        name:
          - ca-certificates
        state: present

    - name: Create Docker GPG key directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Docker's official GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker repository to Apt sources
      ansible.builtin.apt_repository:
        repo: "deb [arch={{ ansible_architecture }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: Update apt cache after adding Docker repository
      ansible.builtin.apt:
        update_cache: yes

    - name: Install Docker and Docker Compose
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Ensure Docker service is enabled and started
      ansible.builtin.service:
        name: docker
        state: started
        enabled: yes

    - name: Create directory
      ansible.builtin.file:
        path: /opt/monitoring-server
        state: directory
        mode: '0755'

    - name: Copy compose file
      ansible.builtin.copy:
        src: "../docker/docker-compose.yml"
        dest: "/opt/monitoring-server/docker-compose.yml"
        owner: "{{ansible_user}}"
        group: "{{ansible_user}}"

    - name: Deploy docker compose file
      community.docker.docker_compose_v2:
        project_src: /opt/monitoring-server
        files: docker-compose.yml